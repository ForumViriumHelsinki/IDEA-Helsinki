name: Cascade Shared Module Releases

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  trigger-service-releases:
    if: github.event.pull_request.merged == true && contains(github.event.pull_request.body, 'idea-shared')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if shared module was updated
        id: check-shared
        run: |
          # Check if the merged PR updated the shared module version
          if grep -q '"shared":' .release-please-manifest.json; then
            echo "shared_updated=true" >> $GITHUB_OUTPUT
          fi

      - name: Trigger service releases
        if: steps.check-shared.outputs.shared_updated == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create a new branch for the cascade
          BRANCH_NAME="chore/cascade-shared-release-$(date -u +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH_NAME"

          # Create a trigger file in each service to force release-please to notice changes
          for service in services/*; do
            echo "# Automated trigger for shared module update $(date -u +%Y%m%d-%H%M%S)" > "$service/.release-trigger"
            git add "$service/.release-trigger"
          done

          # Commit the changes
          git commit -m "chore: cascade shared module release to services

          Trigger service releases due to idea-shared update.
          This ensures all services are rebuilt with the latest shared module."

          # Push the branch
          git push -u origin "$BRANCH_NAME"

          # Create a pull request
          gh pr create \
            --title "chore: cascade shared module release to services" \
            --body "Automated PR to trigger service releases after idea-shared update.

          This PR adds trigger files to force release-please to create new service releases that will use the latest shared module version.

          **Note**: This PR can be merged immediately as it only adds trigger files." \
            --base main \
            --head "$BRANCH_NAME"
