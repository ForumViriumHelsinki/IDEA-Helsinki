name: Build and push container images

on:
  push:
    tags:
      - 'orchestrator-v*.*.*'
      - 'fcd-manager-v*.*.*'
      - 'traffic-monitor-v*.*.*'
  pull_request:
    branches:
      - 'main'

concurrency:
  group: container-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_PREFIX: ${{ github.repository }}

jobs:
  build-and-push:
    # Only build on tag pushes or release-please PRs (to validate before merge)
    if: >
      github.event_name == 'push' ||
      startsWith(github.head_ref, 'release-please--branches--main')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [orchestrator, fcd-manager, traffic-monitor]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}/${{ matrix.service }}
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            # match release-please manifest driven release tag format
            type=match,pattern=${{ matrix.service }}-v(\d+.\d+.\d+),group=1
            type=match,pattern=${{ matrix.service }}-v(\d+.\d+),group=1
            type=match,pattern=${{ matrix.service }}-v(\d+),group=1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build locally first and prove the image actually runs. A pushed image is
      # only as good as its entrypoint: 0.30.9 built and pushed green while every
      # import failed at runtime, because the builder and runtime stages had
      # drifted onto different Python minor versions. Gate the push on this.
      - name: Build image for smoke test
        id: smoke_build
        if: |
          github.event_name == 'pull_request' ||
          (github.event_name == 'push' && startsWith(github.ref, format('refs/tags/{0}-v', matrix.service)))
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: false
          load: true
          platforms: linux/amd64
          tags: smoke-test/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Smoke test image
        if: steps.smoke_build.outcome == 'success'
        env:
          IMAGE: smoke-test/${{ matrix.service }}:${{ github.sha }}
        run: |
          # -i is required: without it docker does not forward stdin, python
          # reads an empty script, and the check exits 0 having asserted nothing.
          docker run --rm -i "$IMAGE" /app/.venv/bin/python - <<'EOF'
          import sys
          # The venv must be on the interpreter's search path. When the runtime
          # interpreter's minor version does not match the one the venv was built
          # with, .venv/lib/pythonX.Y/site-packages is silently skipped and every
          # third-party and workspace import fails.
          on_path = [p for p in sys.path if "/app/.venv/" in p]
          assert on_path, f"venv not on sys.path; interpreter={sys.version}; sys.path={sys.path}"
          import idea_shared
          print(f"ok: {sys.version.split()[0]} sees {on_path[0]}")
          EOF

      - name: Push Docker image
        if: |
          github.event_name == 'push' && startsWith(github.ref, format('refs/tags/{0}-v', matrix.service))
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          # SBOM and provenance only for release tags (saves ~30s on regular builds)
          provenance: ${{ startsWith(github.ref, 'refs/tags/') && 'mode=max' || 'false' }}
          sbom: ${{ startsWith(github.ref, 'refs/tags/') }}

  sentry-release:
    # Create Sentry release with commit association and deploy notification.
    # Runs once per tag push; creating the same release multiple times is idempotent.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          # Tag format: {service}-v{version} (e.g., orchestrator-v0.18.1)
          VERSION="${GITHUB_REF_NAME#*-v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "release=idea-helsinki@${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create Sentry release
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: forum-virium-helsinki
          SENTRY_PROJECT: idea-helsinki
        with:
          version: ${{ steps.version.outputs.release }}
          environment: production
