name: Build and push container images

on:
  push:
    tags:
      - 'orchestrator-v*.*.*'
      - 'fcd-manager-v*.*.*'
      - 'traffic-monitor-v*.*.*'
  pull_request:
    branches:
      - 'main'

concurrency:
  group: container-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_PREFIX: ${{ github.repository }}

jobs:
  build-and-push:
    # Only build on tag pushes or release-please PRs (to validate before merge)
    if: >
      github.event_name == 'push' ||
      startsWith(github.head_ref, 'release-please--branches--main')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [orchestrator, fcd-manager, traffic-monitor]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}/${{ matrix.service }}
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            # match release-please manifest driven release tag format
            type=match,pattern=${{ matrix.service }}-v(\d+.\d+.\d+),group=1
            type=match,pattern=${{ matrix.service }}-v(\d+.\d+),group=1
            type=match,pattern=${{ matrix.service }}-v(\d+),group=1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        if: |
          github.event_name == 'pull_request' ||
          (github.event_name == 'push' && startsWith(github.ref, format('refs/tags/{0}-v', matrix.service)))
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          # SBOM and provenance only for release tags (saves ~30s on regular builds)
          provenance: ${{ startsWith(github.ref, 'refs/tags/') && 'mode=max' || 'false' }}
          sbom: ${{ startsWith(github.ref, 'refs/tags/') }}
