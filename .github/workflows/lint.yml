name: Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [idea-helsinki, fcd-manager, traffic-monitor]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install uv
      uses: astral-sh/setup-uv@v4

    - name: Install dependencies
      run: |
        cd services/${{ matrix.service }}
        uv venv
        . .venv/bin/activate
        uv pip install -e ../../shared
        uv pip install -e .[dev]

    - name: Run ruff check
      run: |
        cd services/${{ matrix.service }}
        . .venv/bin/activate
        ruff check --diff

    - name: Run ruff format check
      run: |
        cd services/${{ matrix.service }}
        . .venv/bin/activate
        ruff format --diff
