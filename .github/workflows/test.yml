name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-shared:
    name: Test Shared Library
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: |
          cd shared
          uv venv
          . .venv/bin/activate
          uv pip install -e .[dev]

      - name: Run tests
        timeout-minutes: 5
        run: |
          cd shared
          . .venv/bin/activate
          pytest --cov=idea_shared --cov-report=xml --cov-report=term-missing

  test-services:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        service: [orchestrator, fcd-manager, traffic-monitor]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: |
          cd services/${{ matrix.service }}
          uv venv
          . .venv/bin/activate
          uv pip install -e ../../shared
          uv pip install -e .[dev]

      - name: Run tests
        timeout-minutes: 5
        run: |
          cd services/${{ matrix.service }}
          . .venv/bin/activate
          pytest -v --tb=short --cov --cov-report=xml --cov-report=term-missing
