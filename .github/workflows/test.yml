name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-shared:
    name: Test Shared Library
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --all-packages --all-extras

      - name: Run tests
        timeout-minutes: 5
        run: uv run --package idea-shared --directory shared python -m pytest tests --cov=idea_shared --cov-report=xml --cov-report=term-missing

  test-services:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        service: [orchestrator, fcd-manager, traffic-monitor]
      fail-fast: false

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --all-packages --all-extras

      - name: Run tests
        timeout-minutes: 5
        run: uv run --package ${{ matrix.service }} --directory services/${{ matrix.service }} python -m pytest tests -v --tb=short --cov --cov-report=xml --cov-report=term-missing
