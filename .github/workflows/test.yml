name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-shared:
    name: Test Shared Library
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: |
          cd shared
          uv venv
          . .venv/bin/activate
          uv pip install -e .[dev]

      - name: Run tests
        run: |
          cd shared
          . .venv/bin/activate
          pytest --cov=idea_shared --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: github.event_name == 'push'
        with:
          file: ./shared/coverage.xml
          flags: shared
          name: shared-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  test-services:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [idea-helsinki, fcd-manager, traffic-monitor]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: |
          cd services/${{ matrix.service }}
          uv venv
          . .venv/bin/activate
          uv pip install -e ../../shared
          uv pip install -e .[dev]

      - name: Run tests
        run: |
          cd services/${{ matrix.service }}
          . .venv/bin/activate
          pytest -v --tb=short

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: github.event_name == 'push'
        with:
          flags: ${{ matrix.service }}
          name: ${{ matrix.service }}-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
