# IDEA-Helsinki Orchestrator - Helm values for helm-webapp chart
# Main async orchestration service for IDEA traffic validation
#
# Image Update Strategy:
# ArgoCD Image Updater automatically updates image.tag when new images are pushed.
# See infrastructure repo: argocd/apps/templates/idea-helsinki/idea-helsinki-orchestrator.yaml

image:
  repository: ghcr.io/forumviriumhelsinki/idea-helsinki/orchestrator
  tag: "0.30.11" # Updated by ArgoCD Image Updater
replicaCount: 1
# Recreate strategy avoids the dual-pod surge that deadlocks rollouts when
# the new and old pod compete for InfluxDB's /ready check budget. Costs
# ~30s of "no orchestrator running" per deploy — acceptable for a singleton
# background validation service. See ForumViriumHelsinki/IDEA-Helsinki#437.
deploymentStrategy:
  type: Recreate
progressDeadlineSeconds: 1800 # 30 min: 20-min startup probe + GCS download on startup
serviceAccount:
  create: false
  name: idea-helsinki-shared
keda:
  enabled: false
  minReplicaCount: 0
  maxReplicaCount: 1
  pollingInterval: 30
  cooldownPeriod: 300
  triggers:
  - type: cron
    metadata:
      timezone: Europe/Helsinki
      start: 0 7 * * 1-5
      end: 0 18 * * 1-5
      desiredReplicas: "1"
featureFlags:
  enabled: true
imagePullSecrets:
- name: ghcr-login-secret
podAnnotations: {}
resources:
  limits:
    cpu: "2000m"
    memory: "6Gi"
  requests:
    cpu: "1000m"
    memory: "4Gi"
service:
  type: ClusterIP
  port: 8080
  targetPort: 8080
gateway:
  enabled: true
livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
startupProbe:
  httpGet:
    path: /startup
    port: http
  initialDelaySeconds: 0
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 120 # 20 minutes for initial startup (was 30 = 5 min)
env:
  DATA_DIR:
    value: "/app/data"
  ENVIRONMENT:
    value: "production"
  GCS_BUCKET_NAME:
    value: "idea-helsinki"
  GCS_PREFIX:
    value: ""
  SQLITE_DIR:
    value: "/app/sqlite"
  INFLUX_DB_VALIDATION_TOKEN:
    valueFrom:
      secretKeyRef:
        name: idea-helsinki-secrets
        key: INFLUX_DB_VALIDATION_TOKEN
  INFLUX_DB_FCD_TOKEN:
    valueFrom:
      secretKeyRef:
        name: idea-helsinki-secrets
        key: INFLUX_DB_FCD_TOKEN
  INFLUX_DB_URL:
    valueFrom:
      secretKeyRef:
        name: idea-helsinki-secrets
        key: INFLUX_DB_URL
  INFLUX_DB_ORG:
    valueFrom:
      secretKeyRef:
        name: idea-helsinki-secrets
        key: INFLUX_DB_ORG
  INFLUX_DB_VALIDATION_BUCKET:
    valueFrom:
      secretKeyRef:
        name: idea-helsinki-secrets
        key: INFLUX_DB_VALIDATION_BUCKET
  INFLUX_DB_FCD_BUCKET:
    valueFrom:
      secretKeyRef:
        name: idea-helsinki-secrets
        key: INFLUX_DB_FCD_BUCKET
  SENTRY_DSN:
    valueFrom:
      secretKeyRef:
        name: idea-helsinki-secrets
        key: SENTRY_DSN
  # GOFF evaluation key — authenticates flag-evaluation requests against the
  # relay proxy's AUTHORIZEDKEYS_EVALUATION list. Provisioned in infrastructure
  # repo (gcp/idea_helsinki_secrets.tf -> orchestrator_goff_client_id).
  GOFF_API_KEY:
    valueFrom:
      secretKeyRef:
        name: idea-helsinki-secrets
        key: GOFF_API_KEY
externalSecret:
  enabled: true
  name: idea-helsinki-secrets
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-store
  target:
    name: idea-helsinki-secrets
    creationPolicy: Owner
  data:
  - secretKey: INFLUX_DB_VALIDATION_TOKEN # pragma: allowlist secret
    remoteRef:
      key: idea-helsinki-influx-validation-token
  - secretKey: INFLUX_DB_FCD_TOKEN # pragma: allowlist secret
    remoteRef:
      key: idea-helsinki-influx-fcd-token
  - secretKey: INFLUX_DB_URL # pragma: allowlist secret
    remoteRef:
      key: idea-helsinki-influxdb-url
  - secretKey: INFLUX_DB_ORG # pragma: allowlist secret
    remoteRef:
      key: idea-helsinki-influxdb-org
  - secretKey: INFLUX_DB_VALIDATION_BUCKET # pragma: allowlist secret
    remoteRef:
      key: idea-helsinki-influx-validation-bucket
  - secretKey: INFLUX_DB_FCD_BUCKET # pragma: allowlist secret
    remoteRef:
      key: idea-helsinki-influx-fcd-bucket
  - secretKey: SENTRY_DSN # pragma: allowlist secret
    remoteRef:
      key: sentry_dsn_idea-helsinki
  - secretKey: GOFF_API_KEY # pragma: allowlist secret
    remoteRef:
      key: orchestrator_goff_client_id
volumes:
- name: data-volume
  emptyDir: {}
- name: sqlite-data
  emptyDir: {}
volumeMounts:
- name: data-volume
  mountPath: /app/data
- name: sqlite-data
  mountPath: /app/sqlite
