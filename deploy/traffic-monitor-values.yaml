# IDEA-Helsinki Traffic Monitor - Helm values for helm-webapp chart
# Traffic disturbance monitoring and spatial intersection detection
#
# Image Update Strategy:
# ArgoCD Image Updater automatically updates image.tag when new images are pushed.
# See infrastructure repo: argocd/apps/templates/idea-helsinki/traffic-monitor.yaml

image:
  repository: ghcr.io/forumviriumhelsinki/idea-helsinki/traffic-monitor
  tag: "0.29.0" # Updated by ArgoCD Image Updater
replicaCount: 1
progressDeadlineSeconds: 1800 # 30 min: 20-min startup probe + GCS download on startup
serviceAccount:
  create: false
  name: idea-helsinki-shared
keda:
  enabled: false
  minReplicaCount: 0
  maxReplicaCount: 1
  pollingInterval: 30
  cooldownPeriod: 300
  triggers:
  - type: cron
    metadata:
      timezone: Europe/Helsinki
      start: 0 7 * * 1-5
      end: 0 18 * * 1-5
      desiredReplicas: "1"
featureFlags:
  enabled: true
imagePullSecrets:
- name: ghcr-login-secret
podAnnotations: {}
resources:
  limits:
    cpu: "1500m"
    memory: "1.5Gi"
  requests:
    cpu: "250m"
    memory: "256Mi"
service:
  type: ClusterIP
  port: 8080
  targetPort: 8080
gateway:
  enabled: true
livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
startupProbe:
  httpGet:
    path: /startup
    port: http
  initialDelaySeconds: 0
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 120 # 20 minutes for initial startup (was 30 = 5 min)
env:
  DATA_DIR:
    value: "/app/data"
  ENVIRONMENT:
    value: "production"
  GCS_BUCKET_NAME:
    value: "idea-helsinki"
  GCS_PREFIX:
    value: ""
  SQLITE_DIR:
    value: "/app/sqlite"
  SENTRY_DSN:
    valueFrom:
      secretKeyRef:
        name: traffic-monitor-secrets
        key: SENTRY_DSN
externalSecret:
  enabled: true
  name: traffic-monitor-secrets
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-store
  target:
    name: traffic-monitor-secrets
    creationPolicy: Owner
  data:
  - secretKey: SENTRY_DSN # pragma: allowlist secret
    remoteRef:
      key: sentry_dsn_idea-helsinki
configMap:
  enabled: true
  data:
    HELSINKI_WFS_URL: "https://kartta.hel.fi/ws/geoserver/avoindata/wfs"
    WFS_TYPENAME: "avoindata:Liikennehairiöt"
    CHECK_INTERVAL: "300" # Check every 5 minutes
volumes:
- name: data-volume
  emptyDir: {}
- name: sqlite-data
  emptyDir: {}
volumeMounts:
- name: data-volume
  mountPath: /app/data
- name: sqlite-data
  mountPath: /app/sqlite
