apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-gcs-server
  namespace: idea-helsinki
  labels:
    app.kubernetes.io/name: fake-gcs-server
    app.kubernetes.io/component: storage-emulator
    app.kubernetes.io/part-of: idea-helsinki
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fake-gcs-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fake-gcs-server
        app.kubernetes.io/component: storage-emulator
        app.kubernetes.io/part-of: idea-helsinki
    spec:
      containers:
      - name: fake-gcs-server
        image: fsouza/fake-gcs-server:latest
        args:
          - "-scheme"
          - "http"
          - "-port"
          - "4443"
          - "-external-url"
          - "http://fake-gcs-server:4443"
        ports:
        - name: http
          containerPort: 4443
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /storage/v1/b
            port: 4443
          initialDelaySeconds: 2
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: fake-gcs-server
  namespace: idea-helsinki
  labels:
    app.kubernetes.io/name: fake-gcs-server
    app.kubernetes.io/component: storage-emulator
    app.kubernetes.io/part-of: idea-helsinki
spec:
  selector:
    app.kubernetes.io/name: fake-gcs-server
  ports:
  - port: 4443
    targetPort: 4443
    name: http
  type: ClusterIP
