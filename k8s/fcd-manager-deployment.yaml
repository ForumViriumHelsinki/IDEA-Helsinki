apiVersion: apps/v1
kind: Deployment
metadata:
  name: fcd-manager
  namespace: idea-helsinki
  labels:
    app.kubernetes.io/name: fcd-manager
    app.kubernetes.io/component: data-sync
    app.kubernetes.io/part-of: idea-helsinki
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fcd-manager
      app.kubernetes.io/component: data-sync
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fcd-manager
        app.kubernetes.io/component: data-sync
        app.kubernetes.io/part-of: idea-helsinki
    spec:
      containers:
      - name: fcd-manager
        image: fcd-manager
        envFrom:
        - secretRef:
            name: idea-helsinki-secrets
        volumeMounts:
        - name: data-volume
          mountPath: /app/data
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        ports:
        - name: http
          containerPort: 8080
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /startup
            port: http
          initialDelaySeconds: 0
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
      volumes:
      - name: data-volume
        hostPath:
          path: /Users/lgates/repos/IDEA-Helsinki/data
          type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: fcd-manager
  namespace: idea-helsinki
  labels:
    app.kubernetes.io/name: fcd-manager
    app.kubernetes.io/component: data-sync
    app.kubernetes.io/part-of: idea-helsinki
spec:
  selector:
    app.kubernetes.io/name: fcd-manager
    app.kubernetes.io/component: data-sync
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  type: ClusterIP
