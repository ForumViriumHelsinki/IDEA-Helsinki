apiVersion: apps/v1
kind: Deployment
metadata:
  name: idea-helsinki
  namespace: idea-helsinki
  labels:
    app.kubernetes.io/name: idea-helsinki
    app.kubernetes.io/component: orchestrator
    app.kubernetes.io/part-of: idea-helsinki
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: idea-helsinki
      app.kubernetes.io/component: orchestrator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: idea-helsinki
        app.kubernetes.io/component: orchestrator
        app.kubernetes.io/part-of: idea-helsinki
    spec:
      containers:
      - name: idea-helsinki
        image: orchestrator
        ports:
        - name: http
          containerPort: 8080
        envFrom:
        - secretRef:
            name: idea-helsinki-secrets
        volumeMounts:
        - name: data-volume
          mountPath: /app/data
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /startup
            port: http
          initialDelaySeconds: 0
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
      volumes:
      - name: data-volume
        hostPath:
          path: /Users/lgates/repos/IDEA-Helsinki/data
          type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: idea-helsinki
  namespace: idea-helsinki
  labels:
    app.kubernetes.io/name: idea-helsinki
    app.kubernetes.io/component: orchestrator
    app.kubernetes.io/part-of: idea-helsinki
spec:
  selector:
    app.kubernetes.io/name: idea-helsinki
    app.kubernetes.io/component: orchestrator
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  type: ClusterIP
