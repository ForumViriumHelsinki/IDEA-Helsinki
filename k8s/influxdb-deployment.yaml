apiVersion: v1
kind: ConfigMap
metadata:
  name: influxdb-init-scripts
  namespace: idea-helsinki
  labels:
    app.kubernetes.io/name: influxdb
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: idea-helsinki
data:
  init-buckets.sh: |
    #!/bin/sh

    # ==============================================================================
    # InfluxDB Initialization Script for Kubernetes
    # ==============================================================================
    # This script runs automatically on first container startup to create
    # additional buckets and API tokens beyond the initial setup.
    #
    # IMPORTANT: This only runs once when InfluxDB is uninitialized.
    # To re-run, delete the PVC and restart the pod.
    # ==============================================================================

    set -e

    echo "==> Starting InfluxDB initialization script..."

    # Wait a moment for InfluxDB to be fully ready
    sleep 2

    # The DOCKER_INFLUXDB_INIT_* environment variables create:
    # - Organization: idea-helsinki
    # - Initial bucket: fcd-data
    # - Admin user with token
    #
    # This script creates additional buckets and scoped tokens

    echo "==> Creating validation bucket..."
    influx bucket create \
      --name validation \
      --retention 0 \
      --description "IDEA validation results storage" \
      || echo "Warning: validation bucket may already exist"

    echo "==> Initialization complete!"
    echo "==> Available buckets: fcd-data, validation"
    echo "==> Admin token: $DOCKER_INFLUXDB_INIT_ADMIN_TOKEN"
    echo "==> Note: For production, create scoped tokens via InfluxDB UI or CLI"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: influxdb-pvc
  namespace: idea-helsinki
  labels:
    app.kubernetes.io/name: influxdb
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: idea-helsinki
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: influxdb
  namespace: idea-helsinki
  labels:
    app.kubernetes.io/name: influxdb
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: idea-helsinki
spec:
  serviceName: influxdb
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: influxdb
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: influxdb
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: idea-helsinki
    spec:
      containers:
      - name: influxdb
        image: influxdb:2.7-alpine
        ports:
        - containerPort: 8086
          name: http
        env:
        - name: DOCKER_INFLUXDB_INIT_MODE
          value: "setup"
        - name: DOCKER_INFLUXDB_INIT_USERNAME
          value: "admin"
        - name: DOCKER_INFLUXDB_INIT_PASSWORD
          value: "adminpassword"
        - name: DOCKER_INFLUXDB_INIT_ORG
          value: "idea-helsinki"
        - name: DOCKER_INFLUXDB_INIT_BUCKET
          value: "fcd-data"
        - name: DOCKER_INFLUXDB_INIT_ADMIN_TOKEN
          value: "dev-token-changeme"
        volumeMounts:
        - name: influxdb-storage
          mountPath: /var/lib/influxdb2
        - name: init-scripts
          mountPath: /docker-entrypoint-initdb.d
          readOnly: true
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8086
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8086
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: influxdb-storage
        persistentVolumeClaim:
          claimName: influxdb-pvc
      - name: init-scripts
        configMap:
          name: influxdb-init-scripts
          defaultMode: 0755  # Make scripts executable
---
apiVersion: v1
kind: Service
metadata:
  name: influxdb
  namespace: idea-helsinki
  labels:
    app.kubernetes.io/name: influxdb
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: idea-helsinki
spec:
  selector:
    app.kubernetes.io/name: influxdb
    app.kubernetes.io/component: database
  ports:
  - port: 8086
    targetPort: 8086
    name: http
  type: ClusterIP
