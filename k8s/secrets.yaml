apiVersion: v1
kind: Secret
metadata:
  name: idea-helsinki-secrets
  namespace: idea-helsinki
type: Opaque
stringData:
  # Azure configuration
  AZURE_ACCOUNT_NAME: "your-azure-account-name"
  AZURE_CONTAINER_NAME: "your-container-name"
  AZURE_SAS_TOKEN: "your-sas-token"
  
  # InfluxDB configuration
  INFLUX_DB_ORG: "TFDS"
  INFLUX_DB_URL: "http://influxdb:8086"
  INFLUX_DB_FCD_BUCKET: "idea-fcd-bucket"
  INFLUX_DB_FCD_TOKEN: "your-fcd-token"
  INFLUX_DB_VALIDATION_BUCKET: "idea-validation-bucket"
  INFLUX_DB_VALIDATION_TOKEN: "your-validation-token"