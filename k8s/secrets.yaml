apiVersion: v1
kind: Secret
metadata:
  name: idea-helsinki-secrets
  namespace: idea-helsinki
type: Opaque
stringData:
  # Azure configuration
  AZURE_ACCOUNT_NAME: "${AZURE_ACCOUNT_NAME:-your-azure-account-name}"
  AZURE_CONTAINER_NAME: "${AZURE_CONTAINER_NAME:-your-container-name}"
  AZURE_SAS_TOKEN: "${AZURE_SAS_TOKEN:-your-sas-token}"

  # InfluxDB configuration
  INFLUX_DB_ORG: "${INFLUX_DB_ORG:-idea-helsinki}"
  INFLUX_DB_URL: "${INFLUX_DB_URL:-http://influxdb:8086}"
  INFLUX_DB_FCD_BUCKET: "${INFLUX_DB_FCD_BUCKET:-idea-fcd-bucket}"
  INFLUX_DB_FCD_TOKEN: "${INFLUX_DB_FCD_TOKEN:-your-fcd-token}"
  INFLUX_DB_VALIDATION_BUCKET: "${INFLUX_DB_VALIDATION_BUCKET:-idea-validation-bucket}"
  INFLUX_DB_VALIDATION_TOKEN: "${INFLUX_DB_VALIDATION_TOKEN:-your-validation-token}"

  # Sentry configuration (optional)
  SENTRY_DSN: "${SENTRY_DSN:-}"
