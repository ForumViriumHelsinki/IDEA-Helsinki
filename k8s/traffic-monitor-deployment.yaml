apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-monitor
  namespace: idea-helsinki
  labels:
    app.kubernetes.io/name: traffic-monitor
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: idea-helsinki
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: traffic-monitor
      app.kubernetes.io/component: monitoring
  template:
    metadata:
      labels:
        app.kubernetes.io/name: traffic-monitor
        app.kubernetes.io/component: monitoring
        app.kubernetes.io/part-of: idea-helsinki
    spec:
      containers:
      - name: traffic-monitor
        image: traffic-monitor
        envFrom:
        - secretRef:
            name: idea-helsinki-secrets
        env:
        - name: HELSINKI_WFS_URL
          value: "https://kartta.hel.fi/ws/geoserver/avoindata/wfs"
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          exec:
            command:
            - python
            - -c
            - "print('alive')"
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          exec:
            command:
            - python
            - -c
            - "print('ready')"
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: traffic-monitor
  namespace: idea-helsinki
  labels:
    app.kubernetes.io/name: traffic-monitor
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: idea-helsinki
spec:
  selector:
    app.kubernetes.io/name: traffic-monitor
    app.kubernetes.io/component: monitoring
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  type: ClusterIP