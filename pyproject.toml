[project]
name = "idea-helsinki"
version = "0.0.0"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["shared", "services/orchestrator", "services/fcd-manager", "services/traffic-monitor"]

[tool.uv.sources]
idea-shared = { workspace = true }

[tool.ruff]
target-version = "py312"
line-length = 88
fix = true

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by line-length)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
exclude = [
    ".claude/worktrees/",
    "shared/src/idea_shared/lib/TomTomFcdAggregator.py",
    "shared/src/idea_shared/classes/HelsinkiWFSClient.py",
    "shared/src/idea_shared/health/example_usage.py",
]

[dependency-groups]
dev = [
    "ty>=0.0.24",
]
