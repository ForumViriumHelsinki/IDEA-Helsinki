[project]
name = "idea-helsinki"
version = "0.0.0"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["shared", "services/orchestrator", "services/fcd-manager", "services/traffic-monitor"]

[tool.uv.sources]
idea-shared = { workspace = true }

[tool.ruff]
target-version = "py312"
line-length = 88
fix = true

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "D",   # pydocstyle
]
ignore = [
    "E501",  # line too long (handled by line-length)
    "D100",  # missing docstring in public module
    "D104",  # missing docstring in public package
    "D107",  # missing docstring in __init__
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["D"]  # no docstring requirements in tests

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
exclude = [
    ".claude/worktrees/",
    "shared/src/idea_shared/lib/TomTomFcdAggregator.py",
    "shared/src/idea_shared/classes/HelsinkiWFSClient.py",
    "shared/src/idea_shared/health/example_usage.py",
]

[dependency-groups]
dev = [
    "ty>=0.0.24",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.6",
    "mkdocstrings[python]>=1.0.3",
]
