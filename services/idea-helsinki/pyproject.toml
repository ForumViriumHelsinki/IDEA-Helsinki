[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "idea-helsinki"
version = "0.5.0"
description = "IDEA Helsinki traffic validation orchestration service"
requires-python = ">=3.12"
authors = [
    { name = "Forum Virium Helsinki", email = "dev@forumvirium.fi" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "idea-shared",  # Installed from local ./shared directory in Docker
    "influxdb-client",
    "pandas",
    "numpy",
    "azure-storage-blob",
    "requests",
    "sentry-sdk",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-xdist>=3.5.0",
]

[project.scripts]
idea-helsinki = "main:main"


[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 88
fix = true

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by line-length)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
