[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "traffic-monitor"
version = "0.3.3"
description = "Traffic disturbance monitoring and spatial intersection service"
requires-python = ">=3.12"
authors = [
    { name = "Forum Virium Helsinki", email = "dev@forumvirium.fi" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "idea-shared==0.2.1", # x-release-please-version
    "requests",
    "geopandas",
    "pandas",
    "shapely",
    "pause",
]

[project.optional-dependencies]
dev = [
    "ruff",
]

[project.scripts]
traffic-monitor = "main:main"


[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 88
fix = true

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by line-length)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
