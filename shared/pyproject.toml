[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "idea-shared"
version = "0.2.0"
description = "Shared code for IDEA Helsinki services"
requires-python = ">=3.12"
authors = [
    { name = "Forum Virium Helsinki", email = "dev@forumvirium.fi" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "influxdb-client",
    "pandas",
    "numpy",
    "azure-storage-blob",
    "requests",
    "shapely",
    "pyproj",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/idea_shared"]

[tool.ruff]
target-version = "py312"
line-length = 88
fix = true

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by line-length)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
