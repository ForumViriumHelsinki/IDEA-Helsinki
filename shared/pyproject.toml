[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "idea-shared"
version = "0.12.3"
description = "Shared code for IDEA Helsinki services"
requires-python = ">=3.12"
authors = [
    { name = "Forum Virium Helsinki", email = "dev@forumvirium.fi" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "influxdb-client",
    "pandas",
    "numpy",
    "azure-storage-blob",
    "requests",
    "shapely",
    "pyproj",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
    "aiohttp>=3.9.0",
    "httpx>=0.27.0",
    "openfeature-sdk>=0.6.0,<0.8.0",
    "gofeatureflag-python-provider>=0.5.0",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-xdist>=3.5.0",
    "freezegun>=1.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/idea_shared"]

[tool.ruff]
target-version = "py312"
line-length = 88
fix = true

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by line-length)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "unit: Unit tests (fast, no external dependencies)",
    "integration: Integration tests (may require external services)",
    "slow: Tests that take significant time",
]
